name: Supabase keep-alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This pings the REST API on a schedule so the inactivity clock keeps resetting.
# NOTE: scheduled pings are an unofficial workaround — not guaranteed by Supabase.
# For anything user-facing, upgrade to Pro (paid projects never auto-pause).
#
# Uses the same repo secrets the deploy workflow already sets, so there is
# nothing extra to configure and no hardcoded project ref to drift out of sync:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '17 9 */3 * *'   # ~09:17 UTC every 3 days
  workflow_dispatch:          # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing EXPO_PUBLIC_SUPABASE_URL or EXPO_PUBLIC_SUPABASE_ANON_KEY secret" >&2
            exit 1
          fi
          URL="${SUPABASE_URL%/}/rest/v1/gigs?select=id&limit=1"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded HTTP $CODE"
          # 2xx/3xx = healthy. Fail the job on anything else so you get notified.
          if [ "$CODE" -ge 400 ]; then exit 1; fi
